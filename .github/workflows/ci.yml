name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ffmpeg and tesseract (the OCR tests run for real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa poppler-utils
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # The Whisper model is mocked in tests — nothing is downloaded here.
      - name: Run tests
        run: pytest -q
